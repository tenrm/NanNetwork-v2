<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nan Network v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>window.NAN_FIREBASE_CONFIG = window.NAN_FIREBASE_CONFIG || null;</script>
<script src="config.js?v=20261126" onerror="void 0"></script>
<style>
:root{
  --issue:#FED7AA; --issue-s:#E07B2A; --issue-bg:#FFF4E8;
  --org:#FDE68A;   --org-s:#C99A06;   --org-bg:#FFFBEA;
  --person:#BBF7D0;--person-s:#1F9D55;--person-bg:#F1FBF4;
  --ink:#2d2a26; --muted:#7a7268; --line:#e7e1d8; --panel:#fffdf9; --bg:#f7f4ef;
  --accent:#b45309; --link:#7c6f5d; --danger:#b42318;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:8px}
.brand b{font-size:17px}
.brand span{font-size:12px;color:var(--muted)}
.brand .vtag{font-size:11px;background:#2f6f4e;color:#fff;border-radius:8px;padding:1px 7px;vertical-align:middle}
.brand .v1link{font-size:11px;font-weight:400;color:var(--muted);margin-left:4px}
.brand .v1link:hover{color:inherit}
.proj{display:flex;align-items:center;gap:6px}
.proj select{min-width:220px;max-width:340px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.spacer{flex:1}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#eef2f0;color:#3c5a49;white-space:nowrap}
.pill.warn{background:#fff3df;color:#8a5300}
.pill.off{background:#f1efec;color:#6b645b}
.pill.err{background:#fde8e6;color:var(--danger)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cfc6b8;background:#fffaf2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#9a4708}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.on{background:#3d3a35;color:#fff;border-color:#3d3a35}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{display:grid;grid-template-columns:270px 1fr 340px;height:calc(100vh - 58px);min-height:520px}
aside{background:var(--panel);overflow:auto;padding:14px}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line);padding:0;display:flex;flex-direction:column}
.sec{margin-bottom:18px}
.sec h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:6px}
.types button{border:2px solid transparent;border-radius:8px;padding:6px 2px;cursor:pointer;font-size:13px}
.types button[data-type=issue]{background:var(--issue)}
.types button[data-type=org]{background:var(--org)}
.types button[data-type=person]{background:var(--person)}
.types button.sel{border-color:var(--ink)}
input[type=text],input[type=search],textarea,select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{resize:vertical}
input[type=range]{accent-color:var(--accent)}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
label>input,label>textarea,label>select{margin-top:3px;color:var(--ink);font-size:14px}
.row{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.legend div{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid}
.dot.issue{background:var(--issue);border-color:var(--issue-s)}
.dot.org{background:var(--org);border-color:var(--org-s)}
.dot.person{background:var(--person);border-color:var(--person-s)}
.legend #wlegend{display:block}
.wl{display:flex;white-space:nowrap;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:3px 0}
.wl i{display:inline-block;width:44px;background:var(--link);border-radius:4px}
.stage{position:relative;overflow:hidden;background:#fff}
#net{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#net.connect{cursor:crosshair}
.ovl{position:absolute;pointer-events:none}
.key{top:10px;left:12px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;display:flex;gap:12px}
.key span{display:flex;align-items:center;gap:5px}
.zoom{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:32px;height:32px;padding:0;font-size:16px}
.banner{position:absolute;left:50%;transform:translateX(-50%);top:10px;background:#3d3a35;color:#fff;font-size:13px;padding:6px 12px;border-radius:999px;display:none;pointer-events:auto}
.banner button{margin-left:8px;background:transparent;border:1px solid #fff8;color:#fff;border-radius:999px;padding:1px 8px;cursor:pointer}
.banner.fb{top:auto;bottom:14px;background:#9a4708;max-width:92%;text-align:center}
.fchips{display:flex;flex-wrap:wrap;gap:5px}
.fchip{border:1px solid var(--issue);background:var(--issue-bg);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.fchip:hover{border-color:var(--issue-s)}
.fchip.on{background:var(--issue);border-color:var(--issue-s);font-weight:600}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.empty>div{background:rgba(255,255,255,.94);border:1px dashed #cfc6b8;border-radius:14px;padding:18px 22px;max-width:360px;pointer-events:auto}
#tip{position:absolute;pointer-events:none;background:#2d2a26;color:#fff;font-size:12px;padding:7px 9px;border-radius:8px;max-width:260px;display:none;line-height:1.45;z-index:5}
#tip b{font-size:13px}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:2}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.sel{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab{padding:14px;display:none;overflow:auto;flex:1}
.tab.sel{display:block}
.muted{color:var(--muted)}
.det-head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.det-title{font-size:18px;font-weight:600;margin:4px 0 2px;word-break:break-word}
h4{font-size:13px;margin:16px 0 6px}
ul.conn{list-style:none;margin:0;padding:0}
ul.conn li{display:grid;grid-template-columns:14px 1fr 70px 16px 20px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid #f0ebe3;font-size:13px}
ul.conn li a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.conn li a:hover{text-decoration:underline}
ul.conn input[type=range]{width:70px}
.x{border:0;background:none;color:#a59c90;cursor:pointer;font-size:16px;padding:0}
.x:hover{color:var(--danger)}
.addlink{display:grid;grid-template-columns:1fr 56px auto;gap:6px;margin-top:8px}
.role-card{border:1px solid var(--line);border-left:5px solid var(--org-s);background:#fff;border-radius:10px;padding:9px 11px;margin-bottom:9px;cursor:pointer}
.role-card:hover{background:#fffdf3}
.role-card.sel{box-shadow:0 0 0 2px var(--org-s) inset}
.rc-h{display:flex;align-items:center;gap:6px}
.rc-h b{flex:1;font-size:14px}
.rc-h small{color:var(--muted)}
.rc-role{font-size:13px;margin:5px 0;white-space:pre-wrap;line-height:1.5}
.rc-role i{color:#b0a698}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid}
.chip.issue{background:var(--issue-bg);border-color:var(--issue)}
.chip.person{background:var(--person-bg);border-color:var(--person)}
.chip.org{background:var(--org-bg);border-color:var(--org)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:11.5px;color:var(--muted)}
.bars .b{display:grid;grid-template-columns:1fr 90px 34px;gap:6px;align-items:center;font-size:12.5px;padding:3px 0;cursor:pointer}
.bars .b:hover{background:#faf6ef}
.bars .b span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.bars .track{height:8px;background:#f1ece4;border-radius:4px;overflow:hidden}
.bars .fill{height:100%;background:var(--accent);opacity:.75}
.bars .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
table.cov{width:100%;border-collapse:collapse;font-size:12.5px}
table.cov th,table.cov td{padding:4px 3px;border-bottom:1px solid #f0ebe3;text-align:right}
table.cov th:first-child,table.cov td:first-child{text-align:left}
table.cov tr.low td{color:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(30,25,20,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal>div{background:#fff;border-radius:14px;padding:18px;width:min(520px,100%);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2d2a26;color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;display:none;z-index:30}
svg text{font-family:"IBM Plex Sans Thai",system-ui,sans-serif}
.halo{paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}
.node{cursor:pointer}
.link{fill:none;stroke:var(--link);stroke-linecap:round;transition:opacity .15s}
.linkhit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
footer{display:none}
@media (max-width:980px){
  main{grid-template-columns:1fr;height:auto}
  .stage{height:72vh;order:-1}
  aside.left,aside.right{border:0;border-top:1px solid var(--line)}
  aside.right{min-height:420px}
  .proj select{min-width:160px}
}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:#fff;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.lang button.on{background:#3d3a35;color:#fff}
.viewsw{position:absolute;top:10px;left:12px;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;z-index:3}
.viewsw button{border:0;background:#fff;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.viewsw button.on{background:#3d3a35;color:#fff}
.lblsw{position:absolute;top:10px;display:none;z-index:3}
.lblsw select{width:auto;padding:4px 8px;font-size:12px;border-radius:999px}
.key{top:48px !important}
.ckey{left:12px;bottom:12px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11.5px;max-width:330px;display:none;line-height:1.55}
.ckey b{font-size:11.5px}
.ckey summary{cursor:pointer;list-style:revert}
.ckey{pointer-events:auto}
.ckey .it{display:inline-flex;align-items:center;gap:4px;margin-right:8px;white-space:nowrap}
.ckey .sq{display:inline-block;width:10px;height:10px;border-radius:50%}
.ckey .ln{display:inline-block;width:22px;border-top:2px solid #555}
.ckey .ln.d{border-top-style:dashed}
.ckey .ln.w{border-top:2px dotted #2f8f5b}
.mapbase text{pointer-events:none}
.mapv path{vector-effect:non-scaling-stroke}
.ckey .sq.out{border:1.5px dashed #888;background:#fff!important}
.ckey .ln.dn{border-top:2px dashed #2b6cb0}
#feedChip{cursor:pointer;background:#e8f3ec;color:#1f5f3c;border:1px solid #b9dcc6}
#feedChip.err{background:#fdecea;color:#8a1f11;border-color:#f3c1b8}
#qrOv{position:fixed;inset:0;background:rgba(20,18,15,.55);display:none;align-items:center;justify-content:center;z-index:80}
#qrOv .box{background:#fff;border-radius:14px;padding:22px 26px;text-align:center;max-width:92vw}
#qrOv .box h3{margin:0 0 6px;font-size:20px}
#qrOv .box a{word-break:break-all;font-size:13px}
#qrOv #qrImg svg{width:min(70vw,420px);height:auto}
.secchk{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.secchk label{display:inline-flex;align-items:center;gap:4px;margin:0;font-size:12px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 8px;cursor:pointer}
.secchk input{margin:0}
.secchk .sw{width:9px;height:9px;border-radius:50%}
.dlgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.dlgrid .btn{text-align:left;font-size:12.5px;padding:6px 8px;white-space:normal;line-height:1.3}
.dlgrid .btn small{display:block;color:var(--muted);font-size:11px}
.dlgrid .btn.wide{grid-column:1 / -1}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Nan Network <span class="vtag">v2</span> <a class="v1link" href="https://tenrm.github.io/NanNetwork/" target="_blank" rel="noopener" data-t="v1link"></a></b><span data-t="subtitle"></span></div>
  <div class="proj">
    <select id="projSel" data-ta="projSel"></select>
    <button class="btn sm" id="projNew" data-t="projNew"></button>
    <button class="btn sm" id="projEdit" data-t="projEdit"></button>
  </div>
  <div class="spacer"></div>
  <div class="lang" role="group" aria-label="Language"><button data-lang="th">ไทย</button><button data-lang="en">EN</button></div>
  <span class="pill" id="feedChip" style="display:none"></span>
  <span class="pill off" id="status">…</span>
  <button class="btn sm" id="authBtn" style="display:none"></button>
</header>

<main>
  <aside class="left">
    <div class="sec edit-only">
      <h3 data-t="addTitle"></h3>
      <div class="types" id="addTypes">
        <button data-type="issue" class="sel" data-t="type_issue"></button>
        <button data-type="org" data-t="type_org"></button>
        <button data-type="person" data-t="type_person"></button>
      </div>
      <input type="text" id="addName" maxlength="80">
      <div class="row"><button class="btn primary" id="addBtn" data-t="addBtn"></button></div>
    </div>

    <div class="sec">
      <h3 data-t="tools"></h3>
      <div class="row" style="margin-top:0">
        <button class="btn on" id="toolSelect" data-t="toolSelect"></button>
        <button class="btn edit-only" id="toolConnect" data-t="toolConnect"></button>
      </div>
      <p class="hint" id="toolHint"></p>
    </div>

    <div class="sec">
      <h3 data-t="searchTitle"></h3>
      <input type="search" id="search" data-tp="searchPh">
      <label><span data-t="minW"></span> <b id="minWv">1</b></label>
      <input type="range" id="minW" min="1" max="5" value="1" style="width:100%">
      <label data-t="sizeBy"></label>
      <select id="sizeBy">
        <option value="degree" data-t="size_str"></option>
        <option value="btw" data-t="size_btw"></option>
        <option value="none" data-t="size_none"></option>
      </select>
      <div class="row edit-only"><button class="btn sm" id="autoLayout" data-t="autoLayout"></button></div>
    </div>

    <div class="sec">
      <h3 data-t="focusTitle"></h3>
      <div class="fchips" id="focusChips"></div>
      <p class="hint" data-t="focusHint"></p>
      <div class="row"><button class="btn sm" id="focusClear" disabled data-t="showAll"></button></div>
    </div>

    <div class="sec">
      <h3 data-t="dlTitle"></h3>
      <div class="dlgrid">
        <button class="btn wide" id="dlXlsx"><b data-t="dlXlsx"></b><small data-t="dlXlsxSub"></small></button>
        <button class="btn wide" id="dlReport"><b data-t="dlReport"></b><small data-t="dlReportSub"></small></button>
        <button class="btn" id="dlPng"><b>PNG</b><small data-t="dlImg"></small></button>
        <button class="btn" id="dlSvg"><b>SVG</b><small data-t="dlVec"></small></button>
      </div>
      <p class="hint" data-t="dlHint"></p>
    </div>

    <div class="sec legend">
      <h3 data-t="legend"></h3>
      <div><span class="dot issue"></span><span data-t="leg_issue"></span></div>
      <div><span class="dot org"></span><span data-t="leg_org"></span></div>
      <div><span class="dot person"></span><span data-t="leg_person"></span></div>
      <div style="margin-top:8px;font-size:12px;color:var(--muted)" data-t="leg_w"></div>
      <div id="wlegend"></div>
    </div>

    <div class="sec">
      <h3 data-t="dataTitle"></h3>
      <div class="row" style="margin-top:0">
        <button class="btn sm" id="expJson" data-t="expJson"></button>
        <button class="btn sm edit-only" id="impJson" data-t="impJson"></button>
      </div>
      <input type="file" id="impFile" accept=".json,application/json" style="display:none">
    </div>
  </aside>

  <section class="stage" id="stage">
    <svg id="net" viewBox="-600 -600 1200 1200" preserveAspectRatio="xMidYMid meet" role="img"></svg>
    <div class="viewsw" id="viewSw"><button data-view="ring" class="on" data-t="viewRing"></button><button data-view="cluster" data-t="viewCluster"></button><button data-view="map" data-t="viewMap"></button></div>
    <div class="lblsw" id="lblSw"><select id="lblMode"><option value="org" data-t="lblOrg"></option><option value="all" data-t="lblAll"></option><option value="none" data-t="lblNone"></option></select></div>
    <div class="ovl ckey" id="keyCluster"></div>
    <div class="ovl ckey" id="keyMap" style="display:none"></div>
    <div class="ovl key" id="keyRing"><span><i class="dot issue"></i><span data-t="type_issue"></span></span><span><i class="dot org"></i><span data-t="type_org"></span></span><span><i class="dot person"></i><span data-t="type_person"></span></span></div>
    <div class="zoom"><button class="btn" id="zIn" data-tt="zIn">+</button><button class="btn" id="zOut" data-tt="zOut">−</button><button class="btn" id="zFit" data-tt="zFit">⟲</button></div>
    <div class="banner" id="banner"></div>
    <div class="banner fb" id="fbanner"></div>
    <div class="empty" id="empty"><div id="emptyBox"></div></div>
    <div id="tip"></div>
    <div id="qrOv"><div class="box"><h3 id="qrT"></h3><div id="qrS" style="color:var(--muted);margin-bottom:8px"></div><div id="qrImg"></div><div><a id="qrA" target="_blank" rel="noopener"></a></div><button class="btn" id="qrX" style="margin-top:12px"></button></div></div>
  </section>

  <aside class="right">
    <div class="tabs">
      <button data-tab="roles" class="sel" data-t="tabRoles"></button>
      <button data-tab="detail" data-t="tabDetail"></button>
      <button data-tab="analysis" data-t="tabAnalysis"></button>
    </div>
    <div class="tab sel" id="tab-roles"></div>
    <div class="tab" id="tab-detail"></div>
    <div class="tab" id="tab-analysis"></div>
  </aside>
</main>

<div class="modal" id="modal"><div id="modalBox"></div></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
/* ---------- i18n ---------- */
const I18N = {
  subtitle:['แผนภาพเครือข่ายศูนย์เรียนรู้น่าน','Nan learning-centre network map'],
  v1link:['↗ v1 (วงเดียว)','↗ v1 (ring only)'],
  seedUpdated:['อัปเดตข้อมูลตัวอย่างเป็นชุดล่าสุดแล้ว','Sample data updated to the latest version'],
  projSel:['เลือกโปรเจค','Choose project'], projNew:['+ โปรเจค','+ Project'], projEdit:['แก้ไข','Edit'],
  type_issue:['ประเด็น','Issue'], type_org:['หน่วยงาน','Organisation'], type_person:['บุคคล','Person'],
  types_issue:['ประเด็น','issues'], types_org:['หน่วยงาน','organisations'], types_person:['บุคคล','people'],
  addTitle:['เพิ่มรายการ','Add item'], addBtn:['+ เพิ่ม','+ Add'],

// Claude artifact db and Firebase Firestore (compat) share this API shape.
function docStore(db){
  return {
    subCol(path, cb, err){
      return db.collection(path).onSnapshot(
        snap => cb(snap.docs.map(d => Object.assign({}, d.data(), {id:d.id}))),
        e => err && err(e));
    },
    set(path, data){ return db.doc(path).set(JSON.parse(JSON.stringify(data))); },
    del(path){ return db.doc(path).delete(); }
  };
}
function localStore(){
  const KEY = 'nannetwork-v2';
  let docs = {};
  try { docs = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ docs = {}; }
  const subs = new Set();
  const parent = p => p.split('/').slice(0,-1).join('/');
  const list = col => Object.keys(docs).filter(k => parent(k) === col).map(k => Object.assign({}, docs[k], {id:k.split('/').pop()}));
  const emit = col => subs.forEach(s => { if (s.path === col) s.cb(list(col)); });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(docs)); } catch(e){} };
  window.addEventListener('storage', e => {
    if (e.key !== KEY) return;
    try { docs = JSON.parse(e.newValue || '{}') || {}; } catch(_){ return; }
    subs.forEach(s => s.cb(list(s.path)));
  });
  return {
    isEmpty: () => Object.keys(docs).length === 0,
    subCol(path, cb){ const s = {path, cb}; subs.add(s); setTimeout(() => cb(list(path)), 0); return () => subs.delete(s); },
    async set(path, data){ docs[path] = JSON.parse(JSON.stringify(data)); save(); emit(parent(path)); },
    async del(path){ delete docs[path]; save(); emit(parent(path)); },
    async setMany(list){ const cols = new Set(); list.forEach(([path, data]) => { if (data == null) delete docs[path]; else docs[path] = JSON.parse(JSON.stringify(data)); cols.add(parent(path)); }); save(); cols.forEach(emit); }
  };
}

}

async function init(){
  bindUI(); setupSvg(); applyLang();
  try { const v = localStorage.getItem('nannetwork-v2-view'); if (v !== 'ring') setView(v === 'map' ? 'map' : 'cluster'); } catch(e){ setView('cluster'); }
  if (window.claude && typeof window.claude.use === 'function'){
    S.mode = 'claude'; setStatus(T('st_loading'), 'off');
    let db = null;
    try { db = await window.claude.use('db'); } catch(e){ db = null; }
    if (!db){ setStatus(T('st_signin'), 'err'); showEmpty('<b>' + T('cantLoad') + '</b><p class="muted">' + T('signinNeed') + '</p>'); return; }
    STORE = docStore(db);
    try {
      const u = await window.claude.use('user');
      if (u && typeof u.can === 'function'){ const c = await u.can('data.write'); if (c === false) S.canWrite = false; }
    } catch(e){}
  } else if (window.NAN_FIREBASE_CONFIG && window.NAN_FIREBASE_CONFIG.apiKey){
    S.mode = 'firebase'; S.canWrite = false; setStatus(T('st_loading'), 'off');
    try { STORE = await initFirebase(); }
    catch(e){ console.error(e); S.mode='local'; S.canWrite = true; STORE = localStore(); toast(T('fbFail')); }
  } else {
    S.mode = 'local'; STORE = localStore();
    if (STORE.isEmpty()) await importFromUrl('data.json', true);
    else await refreshSeed();
    startFeed();
  }
  applyPerms();
  subscribeProjects();
}

/* ---------- metrics ---------- */
function computeMetrics(){
  const ids = new Set(S.nodes.map(n => n.id));
  const adj = {}, deg = {}, str = {};

  S.links.forEach(l => {
    if (!ids.has(l.s) || !ids.has(l.t) || l.s === l.t) return;
    adj[l.s].push(l.t); adj[l.t].push(l.s);
    deg[l.s]++; deg[l.t]++; str[l.s] += W(l); str[l.t] += W(l);

/* ---------- cluster view (6 sectors) ---------- */
// sectors a node belongs to: its own, else inherited from linked issues (orgs) or linked orgs (people)
let SECMAP = {};
function buildSecMap(){
  SECMAP = {};
  const own = n => (Array.isArray(n.sectors) ? n.sectors.filter(k => SECK.includes(k)) : []);
  S.nodes.forEach(n => { SECMAP[n.id] = own(n); });
  const nb = id => S.links.filter(l => l.s === id || l.t === id).map(l => nodeById(l.s === id ? l.t : l.s)).filter(Boolean);
  ['org', 'person'].forEach(t => S.nodes.filter(n => n.type === t && !SECMAP[n.id].length).forEach(n => {
    const from = nb(n.id).filter(o => t === 'org' ? o.type === 'issue' : o.type === 'org');
    SECMAP[n.id] = [...new Set([].concat(...from.map(o => SECMAP[o.id] || [])))].filter(k => SECK.includes(k));
  }));
}
function effSectors(n){ return (n && SECMAP[n.id]) || []; }
function hashJ(id, k){ let h = 2166136261 ^ k; for (const ch of String(id)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000 - 0.5; }

}
function cNodeR(n){

}
const cdrag = d3.drag()

  const target = n => { const ss = effSectors(n); if (!ss.length) return {x:0, y:0}; let x = 0, y = 0; ss.forEach(k => { x += C[k].x; y += C[k].y; });
    x /= ss.length; y /= ss.length; const p0 = C[ss[0]]; return {x: p0.x * 0.62 + x * 0.38, y: p0.y * 0.62 + y * 0.38}; };
  const key = shown.map(n => n.id + ':' + effSectors(n).join('+')).join('|') + '#' + links.map(l => l.id).join(',') + '#' + S.sizeBy;

function geoAmpName(t){ t = String(t || '').trim(); if (NANGEO.amp[t]) return t; if (('เมือง' + t) in NANGEO.amp) return 'เมือง' + t; return null; }

  // ---- data ----
  S.vis = visibleSet();
  const shown = S.nodes.filter(n => n.type !== 'issue' && (!S.vis || S.vis.has(n.id)));
  const ids = new Set(shown.map(n => n.id));
  const links = S.links.filter(l => ids.has(l.s) && ids.has(l.t) && l.s !== l.t && W(l) >= S.minW);
  MGEO = {};
  shown.filter(n => n.type === 'org').forEach(n => { MGEO[n.id] = geocodeNode(n); });
  const outs = shown.filter(n => n.type === 'org' && MGEO[n.id].prec === 'out').sort((a, b) => (M.str[b.id] || 0) - (M.str[a.id] || 0));
  const cols = outs.length > 24 ? 2 : 1, rowH = 34, colW = 210, ox = -60 - cols * colW, oy = 60;
  const outPos = {}; outs.forEach((n, i) => { outPos[n.id] = {x: ox + (i % cols) * colW + 14, y: oy + Math.floor(i / cols) * rowH}; });
  const key = shown.map(n => n.id + ':' + (n.area || '') + ':' + n.name).join('|') + '#' + links.map(l => l.id).join(',') + '#' + S.sizeBy;
  if (!noSim && key !== MKEY){
    MKEY = key;
    const sn = shown.map(n => {
      const g = MGEO[n.id], r = cNodeR(n);
      if (n.type === 'person') return {id:n.id, type:'person', r, person:true};
      if (g.prec === 'out') return {id:n.id, type:n.type, r, fx:outPos[n.id].x, fy:outPos[n.id].y};
      const p = MPROJ([g.lon, g.lat]);
      return {id:n.id, type:n.type, r, tx:p[0], ty:p[1], prec:g.prec, x:p[0] + hashJ(n.id, 1) * 30, y:p[1] + hashJ(n.id, 2) * 30};
    });
    const byId = {}; sn.forEach(d => byId[d.id] = d);
    // persons follow their first linked organisation
    sn.filter(d => d.person).forEach(d => {
      const l = links.find(l => (l.s === d.id && byId[l.t] && !byId[l.t].person) || (l.t === d.id && byId[l.s] && !byId[l.s].person));
      const o = l ? byId[l.s === d.id ? l.t : l.s] : null;
      MGEO[d.id] = {prec:'near', txt:T('mp_p_near')};
      const bx = o ? (o.fx != null ? o.fx : o.tx) : Wm / 2, by = o ? (o.fy != null ? o.fy : o.ty) : Hm / 2;
      d.tx = bx; d.ty = by; d.x = bx + hashJ(d.id, 3) * 20; d.y = by + hashJ(d.id, 4) * 20;
    });
    const sim = d3.forceSimulation(sn)
      .force('x', d3.forceX(d => d.tx).strength(d => d.person ? 0.15 : d.prec === 'prov' ? 0.05 : 0.45))
      .force('y', d3.forceY(d => d.ty).strength(d => d.person ? 0.15 : d.prec === 'prov' ? 0.05 : 0.45))
      .force('collide', d3.forceCollide(d => d.r * 1.1 + (d.person ? 3 : 9)).iterations(4))
      .stop();
    for (let i = 0; i < 260; i++) sim.tick();
    sn.forEach(d => MPOS[d.id] = {x:d.fx != null ? d.fx : d.x, y:d.fy != null ? d.fy : d.y});
  }
  const P = id => MPOS[id] || {x:0, y:0};
  // outside box
  const ob = mBase.select('g.outbox'); ob.selectAll('*').remove();
  if (outs.length){
    const h = Math.ceil(outs.length / cols) * rowH + 40;
    ob.append('rect').attr('x', ox - 6).attr('y', oy - 48).attr('width', cols * colW + 8).attr('height', h + 8).attr('rx', 12)
      .attr('fill', '#f7f5f1').attr('stroke', '#cfc6b8').attr('stroke-dasharray', '5 4');
    ob.append('text').attr('x', ox + 8).attr('y', oy - 22).attr('font-size', 15).attr('font-weight', 700).attr('fill', '#8a7d6b').text(T('mp_out'));
  }
  // links: gentle arcs so overlapping lines separate
  const lp = l => { const a = P(l.s), b = P(l.t), dx = b.x - a.x, dy = b.y - a.y, k = 0.12 + (hashJ(l.id, 5) + 0.5) * 0.1;
    return 'M' + a.x + ',' + a.y + 'Q' + ((a.x + b.x) / 2 - dy * k) + ',' + ((a.y + b.y) / 2 + dx * k) + ' ' + b.x + ',' + b.y; };
  mLinks.selectAll('path.link').data(links, d => d.id).join('path').attr('class', 'link').attr('d', lp)
    .attr('stroke-width', d => Math.max(0.8, WW[W(d)] * 0.55)).attr('stroke-dasharray', DASH);
  mHits.selectAll('path.linkhit').data(links, d => d.id).join('path').attr('class', 'linkhit').attr('d', lp)
    .on('click', (e, d) => { e.stopPropagation(); select({kind:'link', id:d.id}); })
    .on('mouseenter', (e, d) => showTip(e, linkTip(d))).on('mousemove', moveTip).on('mouseleave', hideTip);
  const ns = mNodes.selectAll('g.node').data(shown, d => d.id).join(enter => {
    const g = enter.append('g').attr('class', 'node');
    g.append('circle').attr('class', 'ring-sel').attr('fill', 'none').attr('stroke', '#3d3a35').attr('stroke-width', 2.2);
    g.append('circle').attr('class', 'body');
    g.append('text').attr('class', 'lbl halo');
    g.call(MDRAG);
    g.on('click', (e, d) => { if (d._mv){ d._mv = false; return; } e.stopPropagation(); onNodeClick(d); })
     .on('mouseenter', (e, d) => { S.hover = d.id; applyHighlight(); showTip(e, nodeTip(d)); })
     .on('mousemove', moveTip)
     .on('mouseleave', () => { S.hover = null; applyHighlight(); hideTip(); });
    return g;
  });
  const R = d => cNodeR(d) * (d.type === 'person' ? 0.9 : 1.1);
  mapZoomAdjust();
  ns.select('circle.body').attr('r', R)
    .attr('fill', d => d.type === 'person' ? TYPES.person.fill : OTC(d.otype))
    .attr('stroke', d => d.type === 'person' ? TYPES.person.stroke : '#fff').attr('stroke-width', d => d.type === 'person' ? 1.4 : 1.4)
    .attr('stroke-dasharray', d => d.status === 'pending' ? '2 2' : null);
  ns.select('circle.ring-sel').attr('r', d => R(d) + 5).attr('stroke-dasharray', d => S.connectFrom === d.id ? '4 3' : null);
  ns.select('text.lbl').attr('x', d => R(d) + 4).attr('y', 4).attr('font-size', d => d.type === 'person' ? 10.5 : 12)
    .attr('fill', d => d.type === 'person' ? '#14532d' : '#2d2a26')
    .style('display', d => S.lblMode === 'all' || (S.lblMode === 'org' && d.type !== 'person') ? null : 'none')
    .text(d => { const t = dn(d); return t.length > 28 ? t.slice(0, 27) + '…' : t; });
  // view box: map + outside box
  const x0 = outs.length ? ox - 20 : -80, vb = [Math.floor(x0), -70, Math.ceil(Wm + 120 - x0), Hm + 120];
  if (!noSim){ S.vb = vb; svg.attr('viewBox', vb.join(' ')); }
  if (S.connectFrom && MPOS[S.connectFrom]){ const p = MPOS[S.connectFrom]; tempLine.attr('x1', p.x).attr('y1', p.y); }
  renderMapKey(shown);
  applyHighlight();
}
// map view keeps nodes and labels the same size on screen while zooming (dense areas spread out)
function mapZoomAdjust(kk){
  const k = kk || S.zk || 1, P = id => MPOS[id] || {x:0, y:0};
  mNodes.selectAll('g.node').attr('transform', d => 'translate(' + P(d.id).x + ',' + P(d.id).y + ') scale(' + (1 / Math.sqrt(k)) + ')');
  mBase.select('g.amplbl').selectAll('text').attr('transform', f => { const p = MPROJ([f.properties.lon, f.properties.lat]); return 'translate(' + p[0] + ',' + p[1] + ') scale(' + (1 / Math.sqrt(k)) + ')'; });
}
function renderMapKey(shown){
  const used = [...new Set(shown.filter(n => n.type === 'org').map(n => n.otype || ''))];
  const order = OTYPES.map(o => o.k).concat(['']).filter(k => used.includes(k));
  const wasOpen = !$('#keyMap details') || $('#keyMap details').open;
  $('#keyMap').innerHTML = '<details' + (wasOpen ? ' open' : '') + '><summary><b>' + esc(T('ck_title').split('·')[0]) + '</b></summary>' +
    order.map(k => '<span class="it"><i class="sq" style="background:' + OTC(k) + '"></i>' + esc(otName(k)) + '</span>').join('') +
    '<br><span class="it"><i class="ln"></i>' + esc(T('ck_solid')) + '</span><span class="it"><i class="ln d"></i>' + esc(T('ck_dash')) + '</span>' +
    (S.links.some(l => l.status === 'wish') ? '<span class="it"><i class="ln w"></i>' + esc(T('ck_wish')) + '</span>' : '') +
    (S.links.some(l => l.status === 'dataneed') ? '<span class="it"><i class="ln dn"></i>' + esc(T('ck_data')) + '</span>' : '') +
    '<span class="it"><i class="dot person" style="width:9px;height:9px"></i>' + esc(T('ck_person')) + '</span><br><span style="color:var(--muted)">' + esc(T('mp_note')) + '</span></details>';
}

const matches = (n, q) => (n.name || '').toLowerCase().includes(q) || (n.name_en || '').toLowerCase().includes(q);
function applyHighlight(){
  const focus = S.hover || (S.sel && S.sel.kind === 'node' ? S.sel.id : null);
  const selLink = S.sel && S.sel.kind === 'link' ? S.sel.id : null;
  const q = S.search.trim().toLowerCase();
  let act = null;
  if (focus){ act = new Set([focus].concat(M.adj[focus] || [])); }
  else if (selLink){ const l = linkById(selLink); if (l) act = new Set([l.s, l.t]); }
  svg.selectAll('g.node')
    .style('opacity', d => { if (q) return matches(d, q) ? 1 : 0.18; return !act || act.has(d.id) ? 1 : 0.18; })
    .select('circle.ring-sel').style('display', d => (S.sel && S.sel.kind === 'node' && S.sel.id === d.id) || S.connectFrom === d.id || (q && matches(d, q)) ? null : 'none');
  svg.selectAll('path.link')
    .attr('stroke', d => d.id === selLink ? '#b45309' : LCOL(d))
    .style('opacity', d => {
      if (selLink) return d.id === selLink ? 0.95 : 0.08;
      if (focus) return (d.s === focus || d.t === focus) ? 0.85 : 0.06;
      if (q) return 0.12;
      return 0.42;
    });
}

/* ---------- tooltip ---------- */
function nodeTip(d){
  let h = '<b>' + esc(dn(d)) + '</b><br><span style="opacity:.75">' + T('nodeMeta', tl(d.type), M.deg[d.id]||0, M.str[d.id]||0) + '</span>';
  if (S.view === 'map' && MGEO[d.id]) h += '<br><span style="opacity:.75">📍 ' + esc(MGEO[d.id].txt) + '</span>';
  const role = dr(d);
  if (d.type === 'org' && role) h += '<br>' + T('tipRole') + ': ' + esc(role.length > 140 ? role.slice(0,140) + '…' : role);
  const secs = effSectors(d);
  if (d.type === 'org' && d.otype) h += '<br>' + esc(otName(d.otype)) + (d.level ? ' · ' + esc(d.level) : '') + (d.area ? ' · ' + esc(d.area) : '');
  if (secs.length) h += '<br>' + secs.map(k => '<span style="color:' + SECTORS.find(x => x.k === k).c + '">●</span> ' + esc(secName(k))).join(' ');
  if (d.status) h += '<br><span style="opacity:.75">' + esc(stName(d.status)) + '</span>';
  if (d.note) h += '<br><i>' + esc(d.note.slice(0,120)) + '</i>';
  return h;
}
function linkTip(l){
  const a = nodeById(l.s), b = nodeById(l.t);
  return '<b>' + esc(dn(a)) + ' — ' + esc(dn(b)) + '</b><br>' + T('tipImp', W(l), wl(W(l))) + (l.label ? '<br>' + esc(l.label) : '') + (l.status ? '<br><span style="opacity:.75">' + esc(stName(l.status)) + '</span>' : '');
}
function showTip(e, html){ const t = $('#tip'); t.innerHTML = html; t.style.display = 'block'; moveTip(e); }
function moveTip(e){ const t = $('#tip'), r = $('#stage').getBoundingClientRect(); let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14; if (x + 270 > r.width) x = e.clientX - r.left - 270; t.style.left = x + 'px'; t.style.top = y + 'px'; }
function hideTip(){ $('#tip').style.display = 'none'; }

/* ---------- interactions ---------- */
function onNodeClick(d){
  if (S.tool === 'connect' && S.canWrite){
    if (!S.connectFrom){ S.connectFrom = d.id; updateBanner(); renderGraph(); return; }
    if (S.connectFrom === d.id){ S.connectFrom = null; tempLine.style('display','none'); updateBanner(); renderGraph(); return; }
    const from = S.connectFrom; S.connectFrom = null; tempLine.style('display','none'); updateBanner();
    createLink(from, d.id, 3);
    return;
  }
  select({kind:'node', id:d.id});
}
function createLink(s, t, w){
  if (s === t) return;
  const ex = S.links.find(l => (l.s === s && l.t === t) || (l.s === t && l.t === s));
  if (ex){ toast(T('linkExists')); select({kind:'link', id:ex.id}); return; }
  const l = {id:newId('l'), s, t, w:w||3, label:'', created:Date.now()};
  saveLink(l).then(() => { select({kind:'link', id:l.id}); toast(T('linked')); });
}
function select(sel){
  S.sel = sel;
  if (sel) showTab('detail');
  S.panelDirty = false;
  renderGraph(); renderPanels(true);
}
function setTool(t, quiet){
  S.tool = t; if (!quiet){ S.connectFrom = null; tempLine && tempLine.style('display','none'); }
  $('#toolSelect').classList.toggle('on', t === 'select');
  $('#toolConnect').classList.toggle('on', t === 'connect');
  $('#net').classList.toggle('connect', t === 'connect');
  $('#toolHint').textContent = T(t === 'connect' ? 'hintConnect' : 'hintSelect');
  updateBanner(); if (!quiet && svg) renderGraph();
}
function updateBanner(){
  const b = $('#banner');
  if (S.tool !== 'connect'){ b.style.display = 'none'; return; }
  const f = S.connectFrom && nodeById(S.connectFrom);
  b.innerHTML = (f ? T('bannerFrom', esc(dn(f))) : T('bannerConnect')) + '<button id="bannerX">' + T('done') + '</button>';
  b.style.display = 'block';
  $('#bannerX').onclick = () => setTool('select');
}
function showTab(t){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('sel', b.dataset.tab === t));
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('sel', el.id === 'tab-' + t));
}
async function addNode(){
  const name = $('#addName').value.trim();
  if (!name){ $('#addName').focus(); return; }
  if (!S.pid){ toast(T('makeProj')); return; }
  if (S.nodes.some(n => n.type === S.addType && (n.name.trim() === name || (n.name_en||'').trim() === name))){ toast(T('dupName')); return; }
  const n = {id:newId('n'), name, name_en: LANG === 'en' ? name : '', type:S.addType, role:'', role_en:'', note:'', a:null, created:Date.now()};
  $('#addName').value = '';
  await saveNode(n);
  select({kind:'node', id:n.id});
  setTimeout(() => { const r = $(LANG === 'en' ? '#d-role-en' : '#d-role'); if (r) r.focus(); }, 50);
}
async function deleteNode(id){
  const ls = S.links.filter(l => l.s === id || l.t === id);
  for (const l of ls) await write(() => STORE.del(lPath(S.pid, l.id)));
  await write(() => STORE.del(nPath(S.pid, id)));
  select(null); toast(T('deleted'));
}

/* ---------- panels ---------- */
function panelBusy(){
  const a = document.activeElement;
  return a && a.closest && a.closest('aside.right') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'range';
}
function renderPanels(force){
  if (!force && panelBusy()){ S.panelDirty = true; return; }
  S.panelDirty = false;
  renderRoles(); renderDetail(); renderAnalysis();
}
function setFocus(ids){ S.focus = new Set(ids); renderFocusUI(); renderGraph(); renderPanels(true); }
function toggleFocus(id){ const f = new Set(S.focus); if (f.has(id)) f.delete(id); else f.add(id); setFocus(f); }
function focusOnly(id){ setFocus(S.focus.size === 1 && S.focus.has(id) ? [] : [id]); }
function renderFocusUI(){
  const issues = S.nodes.filter(n => n.type === 'issue').sort((a,b) => (a.created||0) - (b.created||0));
  const ids = new Set(issues.map(n => n.id));
  S.focus.forEach(id => { if (!ids.has(id)) S.focus.delete(id); });
  $('#focusChips').innerHTML = issues.length ? issues.map(n => '<button class="fchip' + (S.focus.has(n.id) ? ' on' : '') + '" data-n="' + esc(n.id) + '">' + esc(dn(n)) + '</button>').join('') : '<span class="muted" style="font-size:12px">' + T('noIssues') + '</span>';
  $('#focusChips').querySelectorAll('.fchip').forEach(b => b.onclick = () => toggleFocus(b.dataset.n));
  $('#focusClear').disabled = !S.focus.size;
  const fb = $('#fbanner');
  if (!S.focus.size){ fb.style.display = 'none'; return; }
  const vis = visibleSet() || new Set();

  fb.innerHTML = T('fbanner', issues.filter(n => S.focus.has(n.id)).map(n => esc(dn(n))).join(', '), cO, cP) + ' <button id="fbClear">' + T('showAll') + '</button>';
  fb.style.display = 'block';
  $('#fbClear').onclick = () => setFocus([]);
}
function renderAll(){

  renderFocusUI();
  renderGraph();
  renderPanels(false);
  renderEmpty();
}
function renderEmpty(){
  if (!S.loaded) return;
  if (!S.projects.length){
    showEmpty('<b>' + T('emptyNoProj') + '</b><p class="muted">' + (S.canWrite ? T('emptyNoProjEdit') : T('emptyNoData')) + '</p>' +
      (S.canWrite ? '<div class="row" style="justify-content:center"><button class="btn primary" id="eNew">' + T('newProj') + '</button>' + (S.mode !== 'claude' ? '<button class="btn" id="eSeed">' + T('importSeed') + '</button>' : '') + '</div>' : ''));

}
function showEmpty(html){ $('#emptyBox').innerHTML = html; $('#empty').style.display = 'flex'; }

function chipsFor(n, type){
  const out = [];
  S.links.forEach(l => {
    const o = l.s === n.id ? l.t : (l.t === n.id ? l.s : null); if (!o) return;
    const on = nodeById(o); if (on && on.type === type) out.push({n:on, w:W(l)});
  });
  out.sort((a,b) => b.w - a.w);
  return out.map(x => '<span class="chip ' + type + '" title="' + esc(T('tipImp', x.w, wl(x.w))) + '">' + esc(dn(x.n)) + ' · ' + x.w + '</span>').join('');
}
function renderRoles(){
  const el = $('#tab-roles');

function renderDetail(){
  const el = $('#tab-detail');
  const ro = S.canWrite ? '' : ' disabled';
  if (!S.sel){ el.innerHTML = '<p class="muted">' + T('detailPick') + '</p>'; return; }
  if (S.sel.kind === 'link'){
    const l = linkById(S.sel.id); if (!l){ el.innerHTML = '<p class="muted">' + T('linkGone') + '</p>'; return; }
    const a = nodeById(l.s), b = nodeById(l.t);
    el.innerHTML = '<div class="det-head">' + T('linkTitle') + '</div>' +
      '<div class="det-title"><span class="dot ' + (a?a.type:'') + '"></span> <a href="#" data-n="' + esc(l.s) + '">' + esc(dn(a)) + '</a> — <span class="dot ' + (b?b.type:'') + '"></span> <a href="#" data-n="' + esc(l.t) + '">' + esc(dn(b)) + '</a></div>' +

async function importData(obj, quiet, overwrite){
  let projs = [];
  if (obj && Array.isArray(obj.projects)) projs = obj.projects;
  else if (obj && Array.isArray(obj.nodes)) projs = [obj];
  if (!projs.length){ toast(T('badFile')); return; }
  let firstId = null;
  const okId = x => x && /^[A-Za-z0-9_\-]+$/.test(x);
  for (const p of projs){
    let pid = okId(p.id) ? p.id : newId('p');
    if (!overwrite && S.projects.some(x => x.id === pid)) pid = newId('p');
    firstId = firstId || pid;
    await write(() => STORE.set(pPath(pid), {name:p.name || p.name_en || T('importedProj'), name_en:p.name_en || '', desc:p.desc || '', created:p.created || Date.now()}));
    const idmap = {};
    for (const n of (p.nodes || [])){
      if (!TYPES[n.type]) continue;
      const id = okId(n.id) ? n.id : newId('n'); idmap[n.id] = id;
      await write(() => STORE.set(nPath(pid, id), nodeBody(n)));
    }
    for (const l of (p.links || [])){
      const s = idmap[l.s], t = idmap[l.t]; if (!s || !t) continue;
      const id = okId(l.id) ? l.id : newId('l');
      await write(() => STORE.set(lPath(pid, id), linkBody(Object.assign({}, l, {s, t}))));
    }
  }
  if (!quiet) toast(T('imported', projs.length));
  if (firstId && S.loaded){ S.pid = null; openProject(firstId); renderProjSel(firstId); }
}
const SEED_KEY = 'nannetwork-v2-seed';
async function importFromUrl(url, quiet){
  try {
    const r = await fetch(url, {cache:'no-store'}); if (!r.ok) throw 0;
    const j = await r.json(); await importData(j, quiet);
    try { if (j.seedVersion) localStorage.setItem(SEED_KEY, j.seedVersion); } catch(e){}
  }
  catch(e){ if (!quiet) toast(T('seedFail')); }
}
// local mode: when data.json has a newer seedVersion, overwrite the seeded projects in place (same ids; local-only items are kept)
async function refreshSeed(){
  try {
    const r = await fetch('data.json', {cache:'no-store'}); if (!r.ok) return;
    const j = await r.json(); let cur = null;
    try { cur = localStorage.getItem(SEED_KEY); } catch(e){}
    if (!j.seedVersion || j.seedVersion === cur) return;
    await importData(j, true, true);
    try { localStorage.setItem(SEED_KEY, j.seedVersion); } catch(e){}
    toast(T('seedUpdated'));
  } catch(e){}
}

function feedToGraph(feed, baseData){
  const T = TH, secName = k => TH('sec_' + k);
  const nodes = {}, links = {}, now = Date.now();
  const B = baseData || {nodes:[], links:[]};
  // --- base project (researched network) ---
  const keepIds = new Set();
  B.nodes.forEach(n => { if (!TYPES[n.type]) return; if (n.type === 'person' && !FEED.basePersons) return; keepIds.add(n.id); });
  const bid = id => 'b_' + String(id).replace(/[^A-Za-z0-9_\-]/g, '');
  const baseOrg = {};   // base id -> node copy
  B.nodes.forEach(n => { if (!keepIds.has(n.id)) return; const c = Object.assign({}, n); delete c.id; nodes[bid(n.id)] = c; if (n.type === 'org') baseOrg[n.id] = c; });
  B.links.forEach(l => { if (keepIds.has(l.s) && keepIds.has(l.t)) { const c = Object.assign({}, l); delete c.id; c.s = bid(l.s); c.t = bid(l.t); links[bid(l.id || (l.s + '_' + l.t))] = c; } });
  // name index for matching survey answers to base orgs (full name, parts split by / · |, with/without (…), name_en)
  const idx = {}, amb = new Set();
  const addKey = (k, id) => { if (!k || k.length < 3) return; if (idx[k] && idx[k] !== id) amb.add(k); else idx[k] = id; };
  Object.entries(baseOrg).forEach(([id, n]) => {
    [n.name, n.name_en].filter(Boolean).forEach(full => {
      const parts = [full].concat(String(full).split(/\s*[\/·|]\s*/));
      parts.forEach(pt => {
        addKey(fKey(pt), id);
        addKey(fKey(String(pt).replace(/\([^)]*\)/g, '')), id);
        (String(pt).match(/\(([^)]*)\)/g) || []).forEach(m => addKey(fKey(m), id));
      });
    });
  });
  amb.forEach(k => delete idx[k]);
  // --- survey ---
  const org = {};           // key -> {name, otype, sectors[], resp:0, by:Set, kw:Set, base:id|null}
  const touch = name => {
    let k = fKey(name); if (!k) return null;
    const b = idx[k] || idx[fKey(String(name).replace(/\([^)]*\)/g, ''))] || null;
    if (b) k = '#' + b;
    if (!org[k]) org[k] = {name, otype:'', sectors:[], resp:0, by:new Set(), kw:new Set(), base:b};
    return k;
  };
  const pairs = {};         // kind|a|b -> {kind, a, b, issues:Set, n}
  const addPair = (kind, a, b, issue) => {
    if (!a || !b || a === b) return;
    const [x, y] = kind === 'work' ? [a, b].sort() : [a, b];
    const id = kind + '|' + x + '|' + y; const p = pairs[id] || (pairs[id] = {kind, a:x, b:y, issues:new Set(), n:0});
    p.n++; if (issue) p.issues.add(issue);
  };
  const persons = [];
  (feed.responses || []).forEach(r => {
    const me = touch(r.org); if (!me) return;
    const o = org[me]; o.resp++;
    if (r.otype && !o.otype) o.otype = r.otype;
    (r.sectors || []).forEach(s => { if (SECK.includes(s) && !o.sectors.includes(s)) o.sectors.push(s); });
    (r.partners || []).forEach(p => { const k = touch(p.org); if (!k) return; org[k].by.add(r.org); kwSectors(p.issue).forEach(s => org[k].kw.add(s)); addPair('work', me, k, p.issue); });
    (r.future || []).forEach(p => { const k = touch(p.org); if (!k) return; org[k].by.add(r.org); addPair('wish', me, k, p.issue); });
    (r.data || []).forEach(d => { const k = touch(d.from); if (!k) return; org[k].by.add(r.org); kwSectors(d.what).forEach(s => org[k].kw.add(s)); addPair('dataneed', me, k, d.what); });
    if (r.name) persons.push({name:r.name, org:me});
  });
  const oid = k => org[k] && org[k].base ? bid(org[k].base) : 'fo_' + fHash(k);
  const usedSec = new Set();
  Object.keys(org).forEach(k => {
    const o = org[k];
    const secs = o.sectors.length ? o.sectors.concat([...o.kw].filter(s => !o.sectors.includes(s))) : [...o.kw];
    if (o.resp) o.sectors.forEach(s => usedSec.add(s));
    const role = o.resp ? T('fd_respondent', o.resp) + (o.by.size ? ' · ' + T('fd_mentioned', [...o.by].join(', ')) : '')
                        : T('fd_mentioned', [...o.by].join(', '));
    if (o.base){
      const bn = nodes[bid(o.base)];
      bn.role = [bn.role, role].filter(Boolean).join(' · ');
      bn.sectors = (bn.sectors || []).concat(secs.filter(s => !(bn.sectors || []).includes(s)));
      if (!bn.otype && o.otype) bn.otype = o.otype;
      if (o.resp) bn.status = 'confirmed_org';
      bn.evidence = [bn.evidence, 'แบบสอบถามน่านฟอรั่ม'].filter(Boolean).join('; ');
    } else nodes[oid(k)] = {name:o.name, name_en:'', type:'org', role, sectors:secs, otype:o.otype,
      status:o.resp ? 'confirmed_org' : '', evidence:'แบบสอบถามน่านฟอรั่ม', created:now};
    if (o.resp) o.sectors.forEach(s => { links['fl_' + fHash('sec|' + k + '|' + s)] = {s:oid(k), t:'fs_' + s, w:3, label:T('fd_sec', secName(s)), status:'confirmed_org', created:now}; });
  });
  usedSec.forEach(s => { nodes['fs_' + s] = {name:T('fd_sec', secName(s)), name_en:EN('fd_sec', EN('sec_' + s)), type:'issue', sectors:[s], created:now}; });
  Object.values(pairs).forEach(p => {
    const iss = [...p.issues].join('; ');
    const lab = (p.kind === 'work' ? T('fd_work') : p.kind === 'wish' ? T('fd_wishl') : T('fd_datal')) + (iss ? ': ' + iss : '');
    links['fl_' + fHash(p.kind + '|' + p.a + '|' + p.b)] = {s:oid(p.a), t:oid(p.b), w:p.kind === 'work' ? Math.min(5, 2 + p.n) : 2, label:lab,
      status:p.kind === 'work' ? 'confirmed_org' : p.kind, evidence:'แบบสอบถามน่านฟอรั่ม', created:now};
  });
  persons.forEach(p => {
    const id = 'fp_' + fHash(fKey(p.name) + '|' + p.org);
    nodes[id] = {name:p.name, name_en:'', type:'person', role:'', note:T('fd_resp'), status:'confirmed_org', created:now};
    links['fl_' + fHash('per|' + id)] = {s:id, t:oid(p.org), w:3, label:T('fd_resp'), status:'confirmed_org', created:now};
  });
  return {nodes, links};
}

async function syncFeed(feed){
  const pid = FEED.projectId, base = 'projects/' + pid;
  let raw = {}; try { raw = JSON.parse(localStorage.getItem('nannetwork-v2') || '{}') || {}; } catch(e){}
  const bd = await loadFeedBase();
  const g = feedToGraph(feed, bd);
  const proj = {name:FEED.name || TH('fd_proj'), name_en:EN('fd_proj'), desc:TH('fd_desc', feed.count || 0) + (bd && bd.name ? TH('fd_basedesc', bd.name) : ''), created:(raw[base] && raw[base].created) || 1764000000000};
  const strip = o => { const c = Object.assign({}, o); delete c.created; delete c.a; delete c.id; return JSON.stringify(c); };
  const ops = [];
  if (!raw[base] || strip(raw[base]) !== strip(proj)) ops.push([base, proj]);
  const put = (col, id, body) => {
    const path = base + '/' + col + '/' + id, old = raw[path];
    const doc = col === 'nodes' ? nodeBody(body) : linkBody(body);
    if (old){ doc.created = old.created || doc.created; if (old.a != null) doc.a = old.a; }
    if (!old || strip(old) !== strip(doc)) ops.push([path, doc]);
  };
  Object.entries(g.nodes).forEach(([id, b]) => put('nodes', id, b));
  Object.entries(g.links).forEach(([id, b]) => put('links', id, b));
  Object.keys(raw).forEach(k => {
    const m = k.match(/^projects\/([^/]+)\/(nodes|links)\/((?:f[olsp]|b)_[A-Za-z0-9_\-]+)$/);
    if (m && m[1] === pid && !(m[2] === 'nodes' ? g.nodes : g.links)[m[3]]) ops.push([k, null]);
  });
  if (!ops.length) return 0;
  if (STORE.setMany) await STORE.setMany(ops);
  else for (const [path, doc] of ops) await (doc == null ? STORE.del(path) : STORE.set(path, doc));
  return ops.length;
}

    .concat(nodesSorted.map(n => [n.id, tl(n.type), n.name || '', n.name_en || '', effSectors(n).map(secName).join('; '), n.type === 'org' ? otName(n.otype) : '', n.level || '', n.area || '',
      n.role || '', n.role_en || '', n.note || '', n.status ? stName(n.status) : '', n.evidence || '', M.deg[n.id]||0, M.str[n.id]||0,
      M.deg[n.id] ? r3(M.str[n.id] / M.deg[n.id]) : 0, r3(M.bc[n.id]||0), r3(M.cl[n.id]||0), rank[n.id]])),
    [12, 12, 30, 30, 26, 18, 12, 18, 40, 40, 24, 16, 14, 10, 12, 12, 12, 12, 10]);
  if (A.hasSec) add(T('x_clusters'), [[T('c_sector'), T('x_nOrg'), T('x_nPerson'), T('c_int'), T('c_cross'), T('x_members')]]
    .concat(A.clusters.map(c => [secName(c.s.k), c.orgs.length, c.ppl.length, c.inn, c.cross, c.orgs.concat(c.ppl).map(dn).join('; ')])), [22, 12, 12, 12, 12, 90]);
  // 3 Links
  const linksSorted = A.links.slice().sort((a,b) => W(b) - W(a));
  add(T('x_links'), [[T('x_id'), T('x_from'), T('x_fromType'), T('x_to'), T('x_toType'), T('x_w'), T('x_wl'), T('x_rel'), T('x_status'), T('x_evid')]]
    .concat(linksSorted.map(l => { const a = nodeById(l.s), b = nodeById(l.t); return [l.id, dn(a), tl(a.type), dn(b), tl(b.type), W(l), wl(W(l)), l.label || '', l.status ? stName(l.status) : '', l.evidence || '']; })),
    [12, 30, 12, 30, 12, 10, 14, 40, 16, 16]);
  // 4 Org roles
  const orgs = S.nodes.filter(n => n.type === 'org').sort((a,b) => (M.str[b.id]||0) - (M.str[a.id]||0));
  add(T('x_roles'), [[T('x_org'), T('x_role'), T('x_issues'), T('x_people'), T('x_nI'), T('x_nP'), T('x_str')]]
    .concat(orgs.map(o => { const is = A.nbW(o.id, 'issue'), ps = A.nbW(o.id, 'person'); return [dn(o), dr(o), listW(is), listW(ps), is.length, ps.length, M.str[o.id]||0]; })),
    [30, 50, 45, 45, 10, 10, 10]);
  // 5 Issue coverage
  add(T('x_cov'), [[T('c_issue'), T('x_nOrg'), T('x_pDirect'), T('x_str'), T('x_wavg'), T('x_orgList'), T('x_flag')]]
    .concat(A.cov.map(c => [dn(c.n), c.orgs.length, c.ppl, c.s, r3(c.avg), listW(c.orgs), (c.s === A.minS && A.cov.length > 1) ? T('x_weak') : ''])),
    [28, 14, 22, 14, 14, 60, 18]);
  // 6–7 Matrices
  const wOf = (a, b) => { const l = A.links.find(x => (x.s === a && x.t === b) || (x.s === b && x.t === a)); return l ? W(l) : ''; };
  const issues = S.nodes.filter(n => n.type === 'issue').sort((a,b) => (a.created||0) - (b.created||0));
  const people = S.nodes.filter(n => n.type === 'person').sort((a,b) => (M.str[b.id]||0) - (M.str[a.id]||0));
  const matrix = (rows, cols) => [[T('x_matrixNote')].concat(cols.map(dn)).concat([T('x_total')])]
    .concat(rows.map(r => { const vals = cols.map(c => wOf(r.id, c.id)); return [dn(r)].concat(vals).concat([vals.reduce((s,v) => s + (+v||0), 0)]); }));
  add(T('x_mIO'), matrix(orgs, issues), [34].concat(issues.map(() => 14)).concat([10]));
  if (people.length && orgs.length) add(T('x_mOP'), matrix(people, orgs), [30].concat(orgs.map(() => 12)).concat([10]));
  // 8 Centrality ranking
  const tops = [['Strength', M.str, v => v], ['Betweenness', M.bc, r3], ['Closeness', M.cl, r3]];
  const ranked = tops.map(([, src]) => S.nodes.slice().sort((a,b) => (src[b.id]||0) - (src[a.id]||0)));
  const cent = [[T('x_rank')].concat(...tops.map(([lbl]) => [lbl + ' · ' + T('x_nameTh').replace(/ \(.*\)/, ''), T('x_type'), lbl]))];
  for (let i = 0; i < S.nodes.length; i++) cent.push([i + 1].concat(...ranked.map((arr, k) => { const n = arr[i]; return [dn(n), tl(n.type), tops[k][2](tops[k][1][n.id]||0)]; })));
  add(T('x_cent'), cent, [8, 28, 12, 10, 28, 12, 12, 28, 12, 12]);
  // 9 Bridges
  add(T('x_bridge'), [[T('x_kind'), T('x_nameTh').replace(/ \(.*\)/, ''), T('x_count'), T('x_list')]]
    .concat(A.bridgeO.map(x => [T('x_bOrg'), dn(x.n), x.list.length, listW(x.list)]))
    .concat(A.bridgeP.map(x => [T('x_bP'), dn(x.n), x.list.length, listW(x.list)])), [28, 30, 10, 70]);
  const buf = X.write(wb, {type:'array', bookType:'xlsx'});
  saveFile(fileBase('analysis') + '.xlsx', new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}

function exportReport(){
  if (!needData()) return;
  const A = analysis(), p = S.projects.find(x => x.id === S.pid) || {};
  const date = new Date().toLocaleString(LANG === 'en' ? 'en-GB' : 'th-TH');
  const tbl = (head, rows, cls) => '<table' + (cls ? ' class="' + cls + '"' : '') + '><thead><tr>' + head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
  const topTbl = (src, fmt) => tbl(['#', T('x_nameTh').replace(/ \(.*\)/, ''), T('x_type'), T('x_value')], A.top(src, 10).map((x,i) => [i+1, dn(x.n), tl(x.n.type), fmt(x.v)]));
  const orgs = S.nodes.filter(n => n.type === 'org').sort((a,b) => (M.str[b.id]||0) - (M.str[a.id]||0));
  const kp = [[A.cnt('issue'), T('types_issue')], [A.cnt('org'), T('types_org')], [A.cnt('person'), T('types_person')], [A.E, T('k_links')], [(A.dens*100).toFixed(1) + '%', T('k_dens')], [A.avgDeg.toFixed(1), T('k_avg')], [A.avgW.toFixed(1), T('k_avgw')], [A.comp, T('k_comp')], [A.iso.length, T('k_iso')]];
  const html = '<!DOCTYPE html><html lang="' + LANG + '"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + esc(T('r_title') + ' · ' + pn(p)) + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">' +
    '<style>body{font-family:"IBM Plex Sans Thai",Tahoma,sans-serif;color:#2d2a26;max-width:980px;margin:24px auto;padding:0 20px;font-size:14px;line-height:1.5}' +
    'h1{font-size:26px;margin:0}h2{font-size:18px;margin:28px 0 8px;border-bottom:2px solid #b45309;padding-bottom:4px;break-after:avoid}.muted{color:#7a7268}' +
    '.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.kpi{border:1px solid #e7e1d8;border-radius:10px;padding:8px 10px}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:#7a7268}' +
    'table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}th,td{border-bottom:1px solid #eee5d8;padding:5px 6px;text-align:left;vertical-align:top}th{background:#faf6ef}' +
    '.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.diagram svg{width:100%;height:auto;border:1px solid #e7e1d8;border-radius:12px}' +
    '.btn{position:fixed;right:18px;top:18px;background:#b45309;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}' +
    'ul{margin:4px 0;padding-left:20px}@media print{.btn{display:none}body{margin:0}h2{break-after:avoid}table,tr{break-inside:avoid}.diagram{break-inside:avoid}}@media(max-width:700px){.two{grid-template-columns:1fr}}</style></head><body>' +
    '<button class="btn" onclick="window.print()">' + esc(T('r_print')) + '</button>' +
    '<h1>' + esc(T('r_title')) + ': ' + esc(pn(p)) + '</h1><p class="muted">' + esc(p.desc || '') + '<br>' + esc(T('r_gen', date)) + '</p>' +
    '<h2>' + esc(T('r_overview')) + '</h2><div class="kpis">' + kp.map(k => '<div class="kpi"><b>' + esc(k[0]) + '</b><span>' + esc(k[1]) + '</span></div>').join('') + '</div>' +
    '<h2>' + esc(T('r_diagram')) + '</h2><div class="diagram">' + buildSvg().replace(/ width="1600" height="1600"/, '') + '</div>' +
    (A.hasSec ? '<h2>' + esc(T('a_clusters')) + '</h2>' + tbl([T('c_sector'), T('x_nOrg'), T('x_nPerson'), T('c_int'), T('c_cross')], A.clusters.map(c => [secName(c.s.k), c.orgs.length, c.ppl.length, c.inn, c.cross])) +
      (A.multi.length ? '<h2>' + esc(T('a_multi')) + '</h2>' + tbl([T('x_org'), T('x_sectors'), T('x_otype')], A.multi.map(n => [dn(n), effSectors(n).map(secName).join(', '), otName(n.otype)])) : '') : '') +
    '<h2>' + esc(T('a_wdist')) + '</h2>' + tbl([T('x_w'), T('x_wl'), T('x_count')], A.wdist.map((c,i) => [i+1, wl(i+1), c])) +
    '<h2>' + esc(T('a_str')) + ' · ' + esc(T('r_top')) + '</h2>' + topTbl(M.str, v => v) +
    '<div class="two"><div><h2>' + esc(T('a_btw')) + '</h2>' + topTbl(M.bc, v => v.toFixed(3)) + '</div><div><h2>' + esc(T('a_clo')) + '</h2>' + topTbl(M.cl, v => v.toFixed(3)) + '</div></div>' +
    (A.cov.length ? '<h2>' + esc(T('a_cov')) + '</h2>' + tbl([T('c_issue'), T('x_nOrg'), T('x_pDirect'), T('x_str'), T('x_orgList'), T('x_flag')], A.cov.map(c => [dn(c.n), c.orgs.length, c.ppl, c.s, listW(c.orgs), (c.s === A.minS && A.cov.length > 1) ? T('x_weak') : ''])) : '') +
    (orgs.length ? '<h2>' + esc(T('x_roles')) + '</h2>' + tbl([T('x_org'), T('x_role'), T('x_issues'), T('x_people')], orgs.map(o => [dn(o), dr(o), listW(A.nbW(o.id, 'issue')), listW(A.nbW(o.id, 'person'))])) : '') +
    ((A.bridgeO.length || A.bridgeP.length) ? '<h2>' + esc(T('x_bridge')) + '</h2>' + tbl([T('x_kind'), T('x_nameTh').replace(/ \(.*\)/, ''), T('x_list')], A.bridgeO.map(x => [T('x_bOrg'), dn(x.n), listW(x.list)]).concat(A.bridgeP.map(x => [T('x_bP'), dn(x.n), listW(x.list)]))) : '') +
    (A.iso.length ? '<h2>' + esc(T('a_iso', A.iso.length)) + '</h2><p>' + A.iso.map(n => esc(dn(n)) + ' (' + esc(tl(n.type)) + ')').join(', ') + '</p>' : '') +
    '<h2>' + esc(T('r_allLinks')) + '</h2>' + tbl([T('x_from'), T('x_to'), T('x_w'), T('x_rel')], A.links.slice().sort((a,b) => W(b) - W(a)).map(l => [dn(nodeById(l.s)), dn(nodeById(l.t)), W(l) + ' · ' + wl(W(l)), l.label || ''])) +
    '<h2>' + esc(T('r_glossary')) + '</h2><ul><li>' + esc(T('g_str')) + '</li><li>' + esc(T('g_btw')) + '</li><li>' + esc(T('g_clo')) + '</li><li>' + esc(T('g_dens')) + '</li></ul>' +
    '</body></html>';
  saveFile(fileBase('report') + '.html', new Blob([html], {type:'text/html'}));
}

/* ---------- UI bindings ---------- */
function bindUI(){
  document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  document.querySelectorAll('#addTypes button').forEach(b => b.onclick = () => {
    S.addType = b.dataset.type;
    document.querySelectorAll('#addTypes button').forEach(x => x.classList.toggle('sel', x === b));
    $('#addName').placeholder = T('ph_' + S.addType); $('#addName').focus();
  });
  $('#addBtn').onclick = addNode;
  $('#addName').addEventListener('keydown', e => { if (e.key === 'Enter') addNode(); });
  $('#toolSelect').onclick = () => setTool('select');
  $('#toolConnect').onclick = () => setTool(S.tool === 'connect' ? 'select' : 'connect');
  $('#search').oninput = e => { S.search = e.target.value; applyHighlight(); };
  $('#minW').oninput = e => { S.minW = +e.target.value; $('#minWv').textContent = S.minW; renderGraph(); };
  $('#sizeBy').onchange = e => { S.sizeBy = e.target.value; renderGraph(); };
  $('#autoLayout').onclick = async () => {
    const fixed = S.nodes.filter(n => typeof n.a === 'number');
    if (!fixed.length){ toast(T('autoAlready')); return; }
    for (const n of fixed) await saveNode(Object.assign({}, n, {a:null}));
    toast(T('autoDone'));
  };
  $('#focusClear').onclick = () => setFocus([]);
  document.querySelectorAll('#viewSw button').forEach(b => b.onclick = () => setView(b.dataset.view));
  $('#lblMode').onchange = e => { S.lblMode = e.target.value; renderGraph(); };
  $('#zIn').onclick = () => zoomBy(1.3); $('#zOut').onclick = () => zoomBy(1/1.3); $('#zFit').onclick = () => zoomFit();
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
  $('#projSel').onchange = e => { const id = e.target.value; if (S.projects.some(p => p.id === id)) openProject(id); };
  $('#projNew').onclick = () => projDialog(null);
  $('#projEdit').onclick = () => { const p = S.projects.find(x => x.id === S.pid); if (p) projDialog(p); };
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  $('#expJson').onclick = exportJson;
  $('#dlXlsx').onclick = exportXlsx; $('#dlReport').onclick = exportReport; $('#dlPng').onclick = exportPng; $('#dlSvg').onclick = exportSvg;
  $('#impJson').onclick = () => $('#impFile').click();
  $('#impFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { await importData(JSON.parse(await f.text())); } catch(err){ toast(T('readFail')); }
    e.target.value = '';
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      if ($('#modal').style.display === 'flex'){ closeModal(); return; }
      if (S.connectFrom){ S.connectFrom = null; tempLine.style('display','none'); updateBanner(); renderGraph(); }
      else if (S.tool === 'connect') setTool('select');
      else if (S.sel) select(null);
    }
  });
  $('aside.right').addEventListener('focusout', () => setTimeout(() => { if (S.panelDirty && !panelBusy()) renderPanels(true); }, 120));
  window.addEventListener('hashchange', () => { const h = location.hash.replace(/^#p-/, ''); if (h && h !== S.pid && S.projects.some(p => p.id === h)){ renderProjSel(h); openProject(h); } });
}

init();
})();
</script>
